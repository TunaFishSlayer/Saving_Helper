services:
  - type: web
    name: savings-helper-ocr
    env: python
    region: singapore
    rootDir: ocr_service
    dockerfilePath: ./Dockerfile
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GROQ_API_KEY
        sync: false

  - type: web
    name: savings-helper-backend
    env: node
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    buildCommand: npm install && npx prisma generate
    preDeployCommand: npx prisma migrate deploy
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: savings-helper-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OCR_MICROSERVICE_URL
        fromService:
          type: web
          name: savings-helper-ocr
          property: url
          path: /parse-receipt
      - key: GROQ_API_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com

databases:
  - name: savings-helper-db
    databaseName: savings_helper
    user: postgres
    region: singapore
    plan: free
